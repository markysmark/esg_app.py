<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" role="img" aria-label="Nexus-Opus executive logo">
  <title>Nexus - Opus (Executive)</title>
  <defs>
    <clipPath id="mark-left-exec">
      <rect x="0" y="0" width="28" height="56"/>
    </clipPath>
  </defs>

  <!-- Background pill -->
  <rect width="220" height="56" rx="10" fill="#1A202C"/>

  <!-- ── Chain-link N·O mark – Amber Gold executive variant ──────────── -->
  <!-- Pass 1: silver ring (background layer) -->
  <ellipse cx="20" cy="28" rx="13" ry="10"
           fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
  <!-- Pass 2: gold ring (middle layer) -->
  <ellipse cx="36" cy="28" rx="13" ry="10"
           fill="none" stroke="#D97706" stroke-width="2.5"/>
  <!-- Pass 3: silver ring clipped to left half (front layer) -->
  <ellipse cx="20" cy="28" rx="13" ry="10"
           fill="none" stroke="#E2E8F0" stroke-width="2.5"
           clip-path="url(#mark-left-exec)"/>

  <!-- ── Wordmark ──────────────────────────────────────────────────────── -->
  <text x="60" y="23"
        font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2.5">NEXUS</text>
  <!-- Thin gold rule -->
  <line x1="60" y1="28.5" x2="202" y2="28.5"
        stroke="#D97706" stroke-width="0.6" opacity="0.45"/>
  <text x="60" y="42"
        font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="400" fill="#D97706" letter-spacing="3.5">OPUS</text>
</svg>
