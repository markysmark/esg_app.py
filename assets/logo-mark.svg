<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Nexus-Opus mark">
  <title>Nexus - Opus Mark</title>
  <defs>
    <clipPath id="mark-left-sq">
      <rect x="0" y="0" width="24" height="48"/>
    </clipPath>
  </defs>

  <!-- Background square -->
  <rect width="48" height="48" rx="10" fill="#1A202C"/>

  <!-- ── Chain-link N·O mark centred in 48×48 ──────────────────────────
       Left ring  cx=17  Right ring cx=31   Clip midpoint x=24
  ──────────────────────────────────────────────────────────────────────── -->
  <!-- Pass 1: silver ring -->
  <ellipse cx="17" cy="24" rx="11" ry="9"
           fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
  <!-- Pass 2: teal ring -->
  <ellipse cx="31" cy="24" rx="11" ry="9"
           fill="none" stroke="#0D9488" stroke-width="2.5"/>
  <!-- Pass 3: silver ring left-half front -->
  <ellipse cx="17" cy="24" rx="11" ry="9"
           fill="none" stroke="#E2E8F0" stroke-width="2.5"
           clip-path="url(#mark-left-sq)"/>
</svg>
