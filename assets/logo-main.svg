<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56" role="img" aria-label="Nexus-Opus logo">
  <title>Nexus - Opus</title>
  <defs>
    <!-- Clip to left half of the mark overlap region (midpoint x=28) -->
    <clipPath id="mark-left">
      <rect x="0" y="0" width="28" height="56"/>
    </clipPath>
  </defs>

  <!-- Background pill -->
  <rect width="220" height="56" rx="10" fill="#1A202C"/>

  <!-- ── Chain-link N·O mark ──────────────────────────────────────────────
       Left ring  (silver) cx=20  Right ring (teal) cx=36
       Overlap region x=23–33, clip midpoint x=28
       Pass 1: full silver oval (behind teal on right)
       Pass 2: full teal oval   (in front of silver on right)
       Pass 3: silver oval, clipped to x<28 (in front of teal on left)
  ──────────────────────────────────────────────────────────────────────── -->
  <!-- Pass 1: silver ring (background layer) -->
  <ellipse cx="20" cy="28" rx="13" ry="10"
           fill="none" stroke="#E2E8F0" stroke-width="2.5"/>
  <!-- Pass 2: teal ring (middle layer – covers right side of silver) -->
  <ellipse cx="36" cy="28" rx="13" ry="10"
           fill="none" stroke="#0D9488" stroke-width="2.5"/>
  <!-- Pass 3: silver ring clipped to left half (front layer – covers left side of teal) -->
  <ellipse cx="20" cy="28" rx="13" ry="10"
           fill="none" stroke="#E2E8F0" stroke-width="2.5"
           clip-path="url(#mark-left)"/>

  <!-- ── Wordmark ──────────────────────────────────────────────────────── -->
  <text x="60" y="23"
        font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2.5">NEXUS</text>
  <!-- Thin teal rule separating the two brand words -->
  <line x1="60" y1="28.5" x2="202" y2="28.5"
        stroke="#0D9488" stroke-width="0.6" opacity="0.45"/>
  <text x="60" y="42"
        font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="400" fill="#0D9488" letter-spacing="3.5">OPUS</text>
</svg>
